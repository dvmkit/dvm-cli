name: Bug report
description: Report a reproducible defect in the dvm caller CLI.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first.

        **This repository does not accept unsolicited pull requests.** The reproduction below is what we need; see [CONTRIBUTING.md](https://github.com/dvmkit/dvm-cli/blob/master/CONTRIBUTING.md).

        Remove credentials, wallet material, job tokens, real payment data, customer data, and unredacted logs. If this might be a vulnerability, stop and use [private vulnerability reporting](https://github.com/dvmkit/dvm-cli/security/advisories/new).
  - type: input
    id: cli-version
    attributes:
      label: dvm version
      description: Paste the output of `dvm --version`, or the commit if you build from source.
      placeholder: 0.8.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Paste the output of `node --version`.
      placeholder: v22.18.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, version, architecture, terminal, and shell.
      placeholder: macOS 15.6 arm64, Terminal.app, zsh 5.9
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Paste the command with every secret and identifying value replaced by a synthetic placeholder.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the shortest setup and steps that reproduce the failure. A failing test may be attached or linked as a gist, never opened as a pull request.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include redacted output and whether the failure happens every time.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues for this problem.
          required: true
        - label: I removed all credentials, wallet material, job tokens, real payment data, customer data, and unredacted logs.
          required: true
        - label: This is not a security vulnerability.
          required: true
